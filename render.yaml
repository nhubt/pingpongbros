
services:
  - type: web
    name: pingpongbros
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        value: pingpongbros.club@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: PingPongBros Club &lt;pingpongbros.club@gmail.com&gt;
